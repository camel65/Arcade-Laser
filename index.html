<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Láser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
        }

        /* Botón de Inicio Centrado */
        #btn-inicio {
            padding: 18px 45px;
            font-size: 1.6rem;
            color: #ffffff;
            background: transparent;
            border: 2px solid #00f0ff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            z-index: 10;
        }

        #btn-inicio:hover {
            background-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.9);
            transform: scale(1.08);
        }

        /* Controles Flotantes Superior Derecha */
        .controles {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            gap: 12px;
            z-index: 20;
        }

        .btn-control {
            padding: 10px 22px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: #00f0ff;
            color: #000000;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        #btn-salir:hover {
            background: rgba(255, 0, 85, 0.9);
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
        }

        /* Contenedor del Lienzo */
        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- CAMBIA AQUÍ LA RUTA A TU ARCHIVO DE AUDIO -->
    <audio id="miMusica" src="musica46.mp3" preload="auto" loop></audio>

    <!-- Botón de Inicio -->
    <button id="btn-inicio">Inicio</button>

    <!-- Controles flotantes -->
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>

    <!-- Contenedor del lienzo -->
    <div id="canvas-container">
        <canvas id="arcadeCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('arcadeCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let activo = false;
        let tiempoInicio = 0;

        // Torreta y controles
        let mouseX = 0;
        let mouseY = 0;
        let torretaX = 0;

        // Entidades del juego
        let disparos = [];
        let objetivos = [];
        let particulas = [];
        let puntuacion = 0;
        let temblor = 0;

        const MAX_OBJETIVOS = 10;

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            if (activo) ajustarCanvas();
        });

        // Controles de entrada
        window.addEventListener('mousemove', (e) => {
            if (activo) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (activo && e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        });

        function dispararLaser() {
            const torretaY = canvas.height - 40;
            const angulo = Math.atan2(mouseY - torretaY, mouseX - torretaX);
            const velocidad = 16;

            disparos.push({
                x: torretaX,
                y: torretaY,
                vx: Math.cos(angulo) * velocidad,
                vy: Math.sin(angulo) * velocidad,
                hue: (Date.now() * 0.1) % 360
            });
        }

        window.addEventListener('click', (e) => {
            if (activo && e.target.tagName !== 'BUTTON') {
                dispararLaser();
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (activo && e.target.tagName !== 'BUTTON') {
                if (e.touches.length > 0) {
                    mouseX = e.touches[0].clientX;
                    mouseY = e.touches[0].clientY;
                }
                dispararLaser();
            }
        });

        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Sonido: OFF" : "🔊 Sonido: ON";
        });

        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'block';

            ajustarCanvas();
            inicializarJuego();
            activo = true;

            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Sonido: ON";
            audioElement.play().catch(err => console.log(err));

            iniciarAnimacion();
        });

        btnSalir.addEventListener('click', (e) => {
            e.stopPropagation();
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);

            audioElement.pause();
            audioElement.currentTime = 0;

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';

            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function inicializarJuego() {
            tiempoInicio = Date.now();
            torretaX = canvas.width / 2;
            mouseX = canvas.width / 2;
            mouseY = canvas.height / 2;
            puntuacion = 0;
            temblor = 0;

            disparos = [];
            objetivos = [];
            particulas = [];

            for (let i = 0; i < MAX_OBJETIVOS; i++) {
                crearObjetivo();
            }
        }

        function crearObjetivo() {
            const tipos = ['ESFERA', 'DIAMANTE', 'ESTRELLA'];
            const tipo = tipos[Math.floor(Math.random() * tipos.length)];
            const radio = 18 + Math.random() * 14;

            objetivos.push({
                x: Math.random() * (canvas.width - 80) + 40,
                y: Math.random() * (canvas.height * 0.4) + 50,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                radio: radio,
                tipo: tipo,
                hue: Math.floor(Math.random() * 360),
                rotacion: 0,
                vRotacion: (Math.random() - 0.5) * 0.08
            });
        }

        function generarExplosion(x, y, hue) {
            temblor = 8;
            for (let i = 0; i < 30; i++) {
                const ang = Math.random() * Math.PI * 2;
                const vel = 2 + Math.random() * 7;
                particulas.push({
                    x: x,
                    y: y,
                    vx: Math.cos(ang) * vel,
                    vy: Math.sin(ang) * vel,
                    vida: 1.0,
                    hue: hue,
                    tam: Math.random() * 3.5 + 1.5
                });
            }
        }

        function iniciarAnimacion() {
            if (!activo) return;

            ctx.save();

            // Efecto de temblor al destruir objetivos
            if (temblor > 0) {
                const offsetX = (Math.random() - 0.5) * temblor;
                const offsetY = (Math.random() - 0.5) * temblor;
                ctx.translate(offsetX, offsetY);
                temblor *= 0.85;
                if (temblor < 0.5) temblor = 0;
            }

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const t = (Date.now() - tiempoInicio) * 0.001;
            const torretaY = canvas.height - 40;

            // 1. SEGUIMIENTO SUAVE DE LA TORRETA
            torretaX += (mouseX - torretaX) * 0.15;

            // 2. ACTUALIZAR Y DIBUJAR DISPAROS LÁSER
            for (let i = disparos.length - 1; i >= 0; i--) {
                const d = disparos[i];
                d.x += d.vx;
                d.y += d.vy;

                // Fuera de pantalla
                if (d.x < 0 || d.x > canvas.width || d.y < 0 || d.y > canvas.height) {
                    disparos.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.strokeStyle = `hsl(${d.hue}, 100%, 65%)`;
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${d.hue}, 100%, 50%)`;

                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x - d.vx * 1.5, d.y - d.vy * 1.5);
                ctx.stroke();
                ctx.restore();
            }

            // 3. ACTUALIZAR Y DIBUJAR OBJETIVOS GEOMÉTRICOS CON REBOTE
            for (let i = objetivos.length - 1; i >= 0; i--) {
                const obj = objetivos[i];
                obj.x += obj.vx;
                obj.y += obj.vy;
                obj.rotacion += obj.vRotacion;

                // Rebotes en bordes de la pantalla
                if (obj.x - obj.radio < 20 || obj.x + obj.radio > canvas.width - 20) {
                    obj.vx *= -1;
                    obj.x = Math.max(obj.radio + 20, Math.min(canvas.width - obj.radio - 20, obj.x));
                }
                if (obj.y - obj.radio < 20 || obj.y + obj.radio > canvas.height - 120) {
                    obj.vy *= -1;
                    obj.y = Math.max(obj.radio + 20, Math.min(canvas.height - obj.radio - 120, obj.y));
                }

                // Detección de colisión con los rayos láser
                let colisionado = false;
                for (let j = disparos.length - 1; j >= 0; j--) {
                    const d = disparos[j];
                    const dist = Math.hypot(obj.x - d.x, obj.y - d.y);

                    if (dist < obj.radio + 5) {
                        generarExplosion(obj.x, obj.y, obj.hue);
                        puntuacion += 100;
                        disparos.splice(j, 1);
                        colisionado = true;
                        break;
                    }
                }

                if (colisionado) {
                    objetivos.splice(i, 1);
                    crearObjetivo();
                    continue;
                }

                // Dibujar forma geométrica
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.rotacion);

                ctx.fillStyle = `hsl(${obj.hue}, 100%, 60%)`;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 14;
                ctx.shadowColor = `hsl(${obj.hue}, 100%, 50%)`;

                if (obj.tipo === 'ESFERA') {
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radio, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (obj.tipo === 'DIAMANTE') {
                    ctx.beginPath();
                    ctx.moveTo(0, -obj.radio);
                    ctx.lineTo(obj.radio, 0);
                    ctx.lineTo(0, obj.radio);
                    ctx.lineTo(-obj.radio, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (obj.tipo === 'ESTRELLA') {
                    ctx.beginPath();
                    for (let k = 0; k < 5; k++) {
                        ctx.lineTo(Math.cos((18 + k * 72) * Math.PI / 180) * obj.radio, -Math.sin((18 + k * 72) * Math.PI / 180) * obj.radio);
                        ctx.lineTo(Math.cos((54 + k * 72) * Math.PI / 180) * (obj.radio * 0.5), -Math.sin((54 + k * 72) * Math.PI / 180) * (obj.radio * 0.5));
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }

            // 4. RENDERIZAR PARTÍCULAS DE EXPLOSIÓN
            ctx.save();
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vida -= 0.03;

                if (p.vida <= 0) {
                    particulas.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.vida;
                ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsl(${p.hue}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tam, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 5. DIBUJAR TORRETA LÁSER ARCADE
            const anguloTorreta = Math.atan2(mouseY - torretaY, mouseX - torretaX);

            ctx.save();
            ctx.translate(torretaX, torretaY);

            // Base de la torreta
            ctx.fillStyle = '#11161b';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f0ff';

            ctx.beginPath();
            ctx.arc(0, 15, 32, Math.PI, 0);
            ctx.fill();
            ctx.stroke();

            // Cañón orientado al ratón
            ctx.rotate(anguloTorreta + Math.PI / 2);
            ctx.fillStyle = '#ff007f';
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 12;

            ctx.fillRect(-6, -32, 12, 28);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-4, -34, 8, 4);

            ctx.restore();

            // 6. MARCADOR DE PUNTUACIÓN ARCADE DIGITAL
            ctx.save();
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.fillStyle = '#00f0ff';
            ctx.textAlign = 'left';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f0ff';
            ctx.fillText(`PUNTOS: ${puntuacion}`, 30, 45);
            ctx.restore();

            ctx.restore();

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
